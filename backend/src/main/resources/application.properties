# ============================================================
# FindIt: Smart Lost & Found Matcher - Spring Boot Configuration
# ============================================================
server.port=8080

# ------------------------------------------------------------
# MySQL 8.0 Database Connection
# Configured for native MySQL instance on port 3307 (or override via .env/DB_URL)
# ------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/findit_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ------------------------------------------------------------
# Hibernate & JPA Configuration
# ------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ------------------------------------------------------------
# Security & JWT Configuration
# ------------------------------------------------------------
findit.app.jwtSecret=FindItSecretKeyCollegeCampusSmartMatcherSecurity2026SuperSecureKeyWithHighEntropy!
findit.app.jwtExpirationMs=86400000

# ------------------------------------------------------------
# Smart Item Matching Algorithm Configurations
# ------------------------------------------------------------
findit.matching.min-threshold=50
findit.matching.strong-threshold=80

# ------------------------------------------------------------
# File Upload Configuration
# ------------------------------------------------------------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
findit.upload.dir=./uploads

